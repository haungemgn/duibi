[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-compare-tool"
version = "1.1.0"
description = "按行处理的 Windows 桌面数据对比与格式化工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<7",
]

[project.gui-scripts]
data-compare-tool = "app.main:main"

[tool.setuptools]
packages = ["app"]
